name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is missing."
            echo "::error::Create a token at https://vercel.com/ia-live/settings/tokens then add it in GitHub: Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deploying commit ${GITHUB_SHA::7} to Vercel production..."
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
