<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Session Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0b;
      color: #e4e4e7;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #2a2a2e;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    h1 { font-size: 16px; font-weight: 600; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #141416;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #52525b;
      flex-shrink: 0;
    }

    .status-dot.active { background: #22c55e; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 6px;
      margin-top: 15px;
    }

    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      padding: 10px 12px;
      background: #141416;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 13px;
      outline: none;
    }

    input:focus { border-color: #6366f1; }

    input::placeholder { color: #52525b; }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-start { background: #6366f1; color: white; }
    .btn-start:hover { background: #818cf8; }
    .btn-stop { background: #27272a; color: #a1a1aa; border: 1px solid #2a2a2e; }
    .btn-stop:hover { background: #3f3f46; color: #e4e4e7; }
    .btn-test { background: #22c55e; color: white; }
    .btn-test:hover { background: #16a34a; }
    .btn-button { background: #f59e0b; color: white; }
    .btn-button:hover { background: #d97706; }
    .btn-clear { background: #ef4444; color: white; }
    .btn-clear:hover { background: #dc2626; }

    .info {
      margin-top: 15px;
      padding: 10px;
      background: #141416;
      border-radius: 8px;
      font-size: 12px;
      color: #71717a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AI</div>
    <h1>Session Live</h1>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Inactif</span>
  </div>

  <div id="currentSessionInfo" class="info" style="display: none;">
    <strong>Session actuelle :</strong>
    <div id="currentSessionId" style="word-break: break-all; margin-top: 4px; font-size: 11px;"></div>
  </div>

  <label for="sessionUrl">URL de la session</label>
  <input
    type="url"
    id="sessionUrl"
    placeholder="https://votre-app.com/session/..."
  />

  <label for="apiUrl">URL de l'API</label>
  <input
    type="url"
    id="apiUrl"
    placeholder="https://votre-app.com/api/receive-message"
  />

  <label for="apiKey">Clé API</label>
  <input
    type="password"
    id="apiKey"
    placeholder="ai-session-live-2026-secret"
  />

  <button class="btn btn-start" id="toggleBtn">Démarrer la capture</button>

  <button class="btn btn-test" id="testBtn">🧪 Test Injection</button>
  <button class="btn btn-button" id="testButtonBtn">🔘 Test Bouton Envoi</button>
  <button class="btn btn-clear" id="clearSessionBtn">🗑️ Effacer session</button>

  <div class="info">
    Remplissez les champs ci-dessus avec les informations de votre session, puis cliquez sur "Démarrer".
  </div>

  <script src="popup.js"></script>
</body>
</html>
